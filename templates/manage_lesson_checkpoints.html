<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/manage_lessons">
    <title>Redirecting</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; color: #222; }
        .topbar { background: #005a9e; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 999; }
        .topbar h1 { margin: 0; font-size: 1.05em; }
        .topbar a { color: white; text-decoration: none; font-size: 0.82em; margin-right: 10px; }
        .page { padding: 20px 24px; width: 90%; max-width: 90%; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 18px; }
        h2, h3 { margin-top: 0; }
        .slide-card { border: 1px solid #eee; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #fafafa; }
        .slide-card ul { margin: 8px 0 0 20px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 0.9em; }
        input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { min-height: 90px; }
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9em; display: inline-block; }
        .btn-primary { background: #0078D4; color: white; }
        .btn-danger { background: #A4262C; color: white; }
        table { border-collapse: collapse; width: 100%; margin-top: 14px; }
        th, td { border: 1px solid #ddd; padding: 9px; text-align: left; vertical-align: top; }
        th { background: #f0f0f0; }
        .meta { color: #555; font-size: 0.9em; }
    </style>
</head>
<body>
    <p>Redirecting to <a href="/manage_lessons">Lesson Setup</a>...</p>
</body>
</html>
